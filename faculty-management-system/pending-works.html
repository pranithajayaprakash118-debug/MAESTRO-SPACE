<!-- =========================================================
     PENDING WORKS JAVASCRIPT
========================================================== -->

<script>


/* =========================================================
   DATA
========================================================= */

const WORK_STORAGE_KEY =
    "facultyPendingWorks";

const WORK_MIGRATION_KEY =
    "pendingWorksMigrationVersion";

let works = [];
let editingWorkSource = null;

async function requestWorksApi(url, options = {}) {
    const response = await fetch(url, {
        ...options,
        headers: {
            Accept: "application/json",
            ...(options.body ? { "Content-Type": "application/json" } : {}),
            ...options.headers
        }
    });

    let result = null;
    try {
        result = await response.json();
    }
    catch {
        result = null;
    }

    if (!response.ok) {
        throw new Error(result?.error || `Pending works request failed (${response.status}).`);
    }

    return result;
}

/* =========================================================
   LOAD WORKS
========================================================= */

async function migrateLegacyWorks() {

    const migration =
        await FacultyStorage.getMetadata(
            WORK_MIGRATION_KEY
        );


    if (
        migration &&
        migration.value === 1
    ) {

        return 0;

    }


    const savedWorks =
        localStorage.getItem(
            WORK_STORAGE_KEY
        );


    if (savedWorks === null) {

        await FacultyStorage.saveMetadata(
            WORK_MIGRATION_KEY,
            1
        );

        return 0;

    }


    let legacyWorks;


    try {

        legacyWorks =
            JSON.parse(savedWorks);

    } catch (error) {

        throw new Error(
            "Legacy pending works data is not valid JSON."
        );

    }


    if (!Array.isArray(legacyWorks)) {

        throw new Error(
            "Legacy pending works data is not an array."
        );

    }


    let migratedCount = 0;


    for (const legacyWork of legacyWorks) {

        if (
            !legacyWork ||
            typeof legacyWork !== "object" ||
            Array.isArray(legacyWork)
        ) {

            continue;

        }


        const work = {
            ...legacyWork,
            updatedAt:
                legacyWork.updatedAt ||
                new Date().toISOString()
        };


        if (
            work.id === undefined ||
            work.id === null ||
            work.id === ""
        ) {

            delete work.id;

        }


        await FacultyStorage.add(
            "pendingWorks",
            work
        );

        migratedCount += 1;

    }


    await FacultyStorage.saveMetadata(
        WORK_MIGRATION_KEY,
        1
    );


    return migratedCount;

}



/* =========================================================
   SAVE WORKS TO STORAGE
========================================================= */

async function loadWorks() {
    const indexedDbWorks = await FacultyStorage.getAll("pendingWorks");

    try {
        const sqliteWorks = await requestWorksApi("/api/pending-works");
        if (!Array.isArray(sqliteWorks)) {
            throw new Error("The Pending Works API returned an invalid work list.");
        }

        works = [
            ...sqliteWorks.map(work => ({ ...work, source: "sqlite" })),
            ...indexedDbWorks.map(work => ({ ...work, source: "indexeddb" }))
        ];
    }
    catch (error) {
        console.error("Unable to load SQLite pending works:", error);
        works = indexedDbWorks.map(work => ({ ...work, source: "indexeddb" }));
    }
}



/* =========================================================
   OPEN ADD WORK MODAL
========================================================= */

function openWorkModal() {
    editingWorkSource = null;

    document
        .getElementById("workForm")
        .reset();


    document
        .getElementById("workId")
        .value = "";


    document
        .getElementById("workModalTitle")
        .textContent = "Add Work";


    document
        .getElementById("workPriority")
        .value = "Medium";


    document
        .getElementById("workStatus")
        .value = "Pending";


    const modal =
        bootstrap.Modal.getOrCreateInstance(
            document.getElementById("workModal")
        );


    modal.show();

}



/* =========================================================
   SAVE WORK
========================================================= */

async function saveWork() {
    const task =
        document
            .getElementById("workTask")
            .value
            .trim();


    const deadline =
        document
            .getElementById("workDeadline")
            .value;


    const category =
        document
            .getElementById("workCategory")
            .value;


    const priority =
        document
            .getElementById("workPriority")
            .value;


    const status =
        document
            .getElementById("workStatus")
            .value;


    const description =
        document
            .getElementById("workDescription")
            .value
            .trim();


    const id =
        document
            .getElementById("workId")
            .value;


    if (
        !task ||
        !deadline ||
        !category
    ) {

        alert(
            "Please fill in the task, deadline and category."
        );

        return;

    }

    const payload = { task, deadline, category, priority, status, description };

    try {
        const existingWork = id
            ? works.find(item => item.id === Number(id) && item.source === editingWorkSource)
            : null;

        if (id && existingWork) {
            if (editingWorkSource === "sqlite") {
                await requestWorksApi(`/api/pending-works/${encodeURIComponent(existingWork.id)}`, {
                    method: "PUT",
                    body: JSON.stringify(payload)
                });
            }
            else {
                await FacultyStorage.update("pendingWorks", {
                    ...existingWork,
                    ...payload,
                    updatedAt: new Date().toISOString()
                });
            }
        }
        else {
            await requestWorksApi("/api/pending-works", {
                method: "POST",
                body: JSON.stringify(payload)
            });
        }

        await loadWorks();
        renderWorks();
    } catch (error) {
        console.error("Unable to save work:", error);
        alert(error.message || "Unable to save the work.");
        return;

    }

    const modal =
        bootstrap.Modal.getInstance(
            document.getElementById("workModal")
        );


    if (modal) {

        modal.hide();

    }


}



/* =========================================================
   EDIT WORK
========================================================= */

function editWork(id, source = "indexeddb") {
    const work =
        works.find(
            item =>
                item.id === Number(id) &&
                item.source === source
        );


    if (!work) {

        return;

    }

    editingWorkSource = source;

    document
        .getElementById("workId")
        .value =
        work.id;


    document
        .getElementById("workTask")
        .value =
        work.task;


    document
        .getElementById("workDeadline")
        .value =
        work.deadline;


    document
        .getElementById("workCategory")
        .value =
        work.category;


    document
        .getElementById("workPriority")
        .value =
        work.priority;


    document
        .getElementById("workStatus")
        .value =
        work.status;


    document
        .getElementById("workDescription")
        .value =
        work.description || "";


    document
        .getElementById("workModalTitle")
        .textContent =
        "Edit Work";



    const modal =
        bootstrap.Modal.getOrCreateInstance(
            document.getElementById("workModal")
        );


    modal.show();

}



/* =========================================================
   DELETE WORK
========================================================= */

async function deleteWork(id, source = "indexeddb") {
    const work =
        works.find(
            item =>
                item.id === Number(id) &&
                item.source === source
        );


    if (!work) {

        return;

    }



    const confirmed =
        confirm(
            `Delete "${work.task}"?`
        );


    if (!confirmed) {

        return;

    }



    try {
        if (source === "sqlite") {
            await requestWorksApi(
                `/api/pending-works/${encodeURIComponent(work.id)}`,
                { method: "DELETE" }
            );
        }
        else {
            await FacultyStorage.delete("pendingWorks", work.id);
        }

        await loadWorks();
        renderWorks();

    } catch (error) {

        console.error("Unable to delete work:", error);
        alert(error.message || "Unable to delete the work.");

    }

}



/* =========================================================
   FILTER WORKS
========================================================= */

function filterWorks() {


    const search =
        document
            .getElementById("searchWorks")
            .value
            .trim()
            .toLowerCase();


    const category =
        document
            .getElementById("categoryFilter")
            .value;


    const priority =
        document
            .getElementById("priorityFilter")
            .value;


    const status =
        document
            .getElementById("statusFilter")
            .value;



    const filteredWorks =
        works.filter(
            work => {


                const searchableText =
                    (
                        work.task +
                        " " +
                        work.category +
                        " " +
                        work.priority +
                        " " +
                        work.status +
                        " " +
                        work.description
                    )
                    .toLowerCase();


                const matchesSearch =
                    !search ||
                    searchableText.includes(
                        search
                    );


                const matchesCategory =
                    category === "All" ||
                    work.category === category;


                const matchesPriority =
                    priority === "All" ||
                    work.priority === priority;


                const matchesStatus =
                    status === "All" ||
                    work.status === status;



                return (
                    matchesSearch &&
                    matchesCategory &&
                    matchesPriority &&
                    matchesStatus
                );

            }
        );



    renderWorks(
        filteredWorks
    );

}



/* =========================================================
   CLEAR FILTERS
========================================================= */

function clearFilters() {


    document
        .getElementById("searchWorks")
        .value = "";


    document
        .getElementById("categoryFilter")
        .value = "All";


    document
        .getElementById("priorityFilter")
        .value = "All";


    document
        .getElementById("statusFilter")
        .value = "All";


    renderWorks();

}



/* =========================================================
   RENDER WORKS
========================================================= */

function renderWorks(
    displayWorks = works
) {


    const container =
        document.getElementById(
            "worksContainer"
        );


    updateSummary();



    document
        .getElementById("worksStatusText")
        .textContent =
        getStatusText(
            displayWorks.length
        );



    if (
        displayWorks.length === 0
    ) {


        const hasFilters =
            document
                .getElementById("searchWorks")
                .value
                .trim() !== "" ||
            document
                .getElementById("categoryFilter")
                .value !== "All" ||
            document
                .getElementById("priorityFilter")
                .value !== "All" ||
            document
                .getElementById("statusFilter")
                .value !== "All";



        if (hasFilters) {


            container.innerHTML = `

                <div class="works-empty-state">

                    <div class="empty-icon">

                        <i class="bi bi-search"></i>

                    </div>


                    <h5>
                        No matching works
                    </h5>


                    <p>
                        Try changing your search or filters.
                    </p>


                    <button
                        class="btn btn-primary"
                        onclick="clearFilters()"
                    >

                        <i class="bi bi-arrow-counterclockwise"></i>

                        Clear Filters

                    </button>

                </div>

            `;


        }
        else {


            container.innerHTML = `

                <div class="works-empty-state">

                    <div class="empty-icon">

                        <i class="bi bi-clipboard-check"></i>

                    </div>


                    <h5>
                        No works added yet
                    </h5>


                    <p>
                        Add your first task to start managing your pending works.
                    </p>


                    <button
                        class="btn btn-primary"
                        onclick="openWorkModal()"
                    >

                        <i class="bi bi-plus-lg"></i>

                        Add Work

                    </button>

                </div>

            `;

        }


        return;

    }



    /* Newest first */

    const sortedWorks =
        [...displayWorks].sort(
            (a, b) =>
                b.id - a.id
        );



    container.innerHTML =
        sortedWorks
            .map(
                work =>
                    createWorkCard(work)
            )
            .join("");

}



/* =========================================================
   WORK STATUS TEXT
========================================================= */

function getStatusText(count) {


    const total =
        works.length;


    if (total === 0) {

        return "No works added yet";

    }


    if (count === total) {

        return `${total} work${total === 1 ? "" : "s"}`;

    }


    return `${count} matching work${count === 1 ? "" : "s"} of ${total}`;

}



/* =========================================================
   CREATE WORK CARD
========================================================= */

function createWorkCard(
    work
) {


    const deadline =
        new Date(
            work.deadline +
            "T00:00:00"
        );



    const formattedDeadline =
        deadline.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );



    const today =
        new Date();

    today.setHours(
        0,
        0,
        0,
        0
    );



    const isOverdue =
        deadline < today &&
        work.status !== "Completed";



    const source = work.source || "indexeddb";

    return `

        <div class="work-card">


            <div class="work-card-main">


                <div class="work-icon">

                    <i class="bi bi-clipboard2-check"></i>

                </div>



                <div class="work-details">


                    <h5>

                        ${escapeWorkHtml(
                            work.task
                        )}

                    </h5>



                    <div class="work-meta">


                        <span>

                            <i class="bi bi-calendar3"></i>

                            ${formattedDeadline}

                        </span>



                        <span>

                            <i class="bi bi-folder2"></i>

                            ${escapeWorkHtml(
                                work.category
                            )}

                        </span>



                        ${
                            isOverdue
                            ?
                            `
                            <span class="overdue-text">

                                <i class="bi bi-exclamation-circle"></i>

                                Overdue

                            </span>
                            `
                            :
                            ""
                        }


                    </div>



                    ${
                        work.description
                        ?
                        `
                        <p>

                            ${escapeWorkHtml(
                                work.description
                            )}

                        </p>
                        `
                        :
                        ""
                    }



                    <div class="work-badges">


                        <span
                            class="priority-badge ${work.priority.toLowerCase()}"
                        >

                            ${escapeWorkHtml(
                                work.priority
                            )}
                            Priority

                        </span>



                        <span
                            class="status-badge ${getStatusClass(work.status)}"
                        >

                            ${escapeWorkHtml(
                                work.status
                            )}

                        </span>


                    </div>


                </div>


            </div>



            <div class="work-actions">


                <button
                    class="work-action-btn"
                    onclick="editWork(${work.id}, '${source}')"
                    title="Edit"
                >

                    <i class="bi bi-pencil"></i>

                </button>



                <button
                    class="work-action-btn delete"
                    onclick="deleteWork(${work.id}, '${source}')"
                    title="Delete"
                >

                    <i class="bi bi-trash"></i>

                </button>


            </div>


        </div>

    `;

}



/* =========================================================
   STATUS CLASS
========================================================= */

function getStatusClass(
    status
) {


    if (
        status === "In Progress"
    ) {

        return "in-progress";

    }


    if (
        status === "Completed"
    ) {

        return "completed";

    }


    return "pending";

}



/* =========================================================
   SUMMARY
========================================================= */

function updateSummary() {


    document
        .getElementById("totalWorks")
        .textContent =
        works.length;



    document
        .getElementById("pendingWorks")
        .textContent =
        works.filter(
            work =>
                work.status === "Pending"
        ).length;



    document
        .getElementById("progressWorks")
        .textContent =
        works.filter(
            work =>
                work.status === "In Progress"
        ).length;



    document
        .getElementById("completedWorks")
        .textContent =
        works.filter(
            work =>
                work.status === "Completed"
        ).length;

}



/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeWorkHtml(
    value
) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}



/* =========================================================
   FACULTY NAME
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    async function() {

        const facultyName =
            localStorage.getItem("facultyName") ||
            "Faculty";

        const nameElement =
            document.getElementById(
                "facultyNameDisplay"
            );

        if (nameElement) {
            nameElement.textContent = facultyName;
        }

        const profilePicture =
            localStorage.getItem(
                "facultyProfilePicture"
            );

        const avatar =
            document.getElementById(
                "topProfileAvatar"
            );

        if (
            profilePicture &&
            avatar
        ) {
            avatar.innerHTML =
                `<img src="${profilePicture}" alt="Profile">`;
        }

        try {

            await migrateLegacyWorks();
            await loadWorks();
            renderWorks();

        } catch (error) {

            console.error(
                "Unable to initialize pending works:",
                error
            );

            works = [];
            renderWorks();

        }

    }
);
