<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="login-card">
        <div class="logo-box">
            <i class="bi bi-stars"></i>
        </div>

        <h2>Welcome to Maestro Space</h2>
        <p class="subtitle">Sign in to manage your faculty workspace</p>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label" for="facultyName">Faculty name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input class="form-control" type="text" id="facultyName" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="facultyEmail">Email address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input class="form-control" type="email" id="facultyEmail" required>
                </div>
            </div>

            <button class="btn login-btn w-100" type="submit">Continue</button>
        </form>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
