<header class="topbar">
    <div class="topbar-left">
        <button class="mobile-menu-btn" type="button" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
        </button>

        <div class="topbar-title">
            <h4 data-layout-title>Faculty Management</h4>
            <p data-layout-subtitle>Manage your faculty workspace</p>
        </div>
    </div>

    <div class="topbar-actions">
        <button class="icon-btn" type="button" aria-label="Notifications">
            <i class="bi bi-bell"></i>
        </button>

        <div class="profile-mini">
            <div class="profile-avatar" id="topProfileAvatar">
                <i class="bi bi-person"></i>
            </div>
            <div class="profile-info">
                <strong id="facultyNameDisplay">Faculty</strong>
                <small>Faculty</small>
            </div>
        </div>
    </div>
</header>
